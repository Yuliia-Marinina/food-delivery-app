<app-header></app-header>

<main>
  <!-- Temporary Button Demo -->
  <div class="container" style="padding: 2rem 0">
    <h2>Button Component Demo</h2>

    <div style="display: flex; flex-direction: column; gap: 1rem; max-width: 400px">
      <h3>Primary Buttons</h3>
      <app-button variant="primary" size="small">Small Button</app-button>
      <app-button variant="primary" size="medium">Medium Button</app-button>
      <app-button variant="primary" size="large">Large Button</app-button>

      <h3>Secondary Buttons</h3>
      <app-button variant="secondary" size="medium">Secondary Button</app-button>

      <h3>Text Buttons</h3>
      <app-button variant="text" size="medium">Text Button</app-button>

      <h3>States</h3>
      <app-button variant="primary" [disabled]="true">Disabled Button</app-button>
      <app-button variant="primary" [fullWidth]="true">Full Width Button</app-button>
    </div>
  </div>

  <router-outlet></router-outlet>

  <!-- Temporarily for testing -->
  <app-promo-section></app-promo-section>
</main>

<app-footer></app-footer>

<app-floating-buttons [cartItemsCount]="3"></app-floating-buttons>
