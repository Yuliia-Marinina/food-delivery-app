<section class="promo-section">
  <div class="container">
    <div class="promo-content">
      <div class="promo-text">
        <h2 class="promo-title">Your favorite food, wherever you are.</h2>
        <p class="promo-description">
          Download the FeastFlow app to explore restaurants, track orders, and earn rewards.
          Available for iOS and Android.
        </p>

        <!-- App buttons -->
        <div class="promo-buttons">
          <a href="#" class="app-button">
            <lucide-icon [img]="Apple" [size]="24" class="app-icon"></lucide-icon>

            <div class="app-button-text">
              <span class="app-button-label">Download on the</span>

              <span class="app-button-store">App Store</span>
            </div>
          </a>

          <a href="#" class="app-button">
            <svg class="app-icon" viewBox="0 0 24 24" width="24" height="24">
              <path
                fill="currentColor"
                d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,10.81C20.5,11.08 20.75,11.5 20.75,12C20.75,12.5 20.53,12.9 20.18,13.18L17.89,14.5L15.39,12L17.89,9.5L20.16,10.81M6.05,2.66L16.81,8.88L14.54,11.15L6.05,2.66Z"
              />
            </svg>

            <div class="app-button-text">
              <span class="app-button-label">Get it on</span>
              <span class="app-button-store">Google Play</span>
            </div>
          </a>
        </div>
      </div>

      <!--Mokup image-->
      <div class="promo-image">
        <figure class="promo-image-placeholder">
          <lucide-icon [img]="Smartphone" [size]="120" class="promo-placeholder-icon"></lucide-icon>
          <figcaption class="promo-image-figcaption">App Mockup</figcaption>
        </figure>
      </div>
    </div>
  </div>
</section>
